name: iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: appvault-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.2 toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Block packaging on installed-version contract failures
        run: python3 scripts/check_version_ui.py
      - name: Verify data-copy regression fixtures
        run: |
          swiftc AppVault/AppDataCopy.swift Tests/main.swift -o /tmp/appvault-copy-tests
          /tmp/appvault-copy-tests
      - name: Verify Mach-O parser and failure fixtures
        run: python3 Tests/Decryption/test_parser.py
      - name: Install build tools
        run: brew install xcodegen ldid dpkg
      - name: Verify direct Store protocol fixtures
        run: |
          swiftc -parse-as-library AppVault/StoreProtocol.swift AppVault/Attestation/ApplePropertyList.swift AppVault/AppleVerification.swift Tests/StoreProtocol/main.swift -o /tmp/appvault-store-tests
          /tmp/appvault-store-tests
      - name: Verify manual 2FA entry UI and trusted-device challenge guards
        run: python3 Tests/VerificationUI/test_manual_code.py
      - name: Verify iOS 16 WebKit runtime survival and error diagnostics
        run: |
          python3 Tests/RuntimeUI/test_runtime.py
          node Tests/RuntimeUI/test_inprocess_prelude.cjs
      - name: Verify pinned on-device Store attestation runtime
        run: |
          git clone https://github.com/mengangs/ipadn.git /tmp/appvault-runtime-source
          git -C /tmp/appvault-runtime-source checkout --detach 81dd1f747e71b31629979e2c1de0fe234fe7de39
          cd /tmp/appvault-runtime-source/iPadn-iOS
          python3 scripts/assemble_runtime.py
          node scripts/runtime_smoke_test.cjs
      - name: Run the rootless signer with native WebAssembly disabled
        env:
          APPVAULT_RUNTIME: /tmp/appvault-runtime-source/iPadn-iOS/vendor/SAPRuntime/files
        run: |
          mkdir -p build/host-wasm3
          for source in AppVault/Wasm3/*.c; do
            xcrun clang -O2 -std=gnu11 -c "$source" -o "build/host-wasm3/$(basename "$source" .c).o"
          done
          xcrun swiftc -O -swift-version 5 -D APPVAULT_INTERPRETER_TEST \
            SignerHelper/main.swift SignerHelper/Support.swift \
            AppVault/Attestation/InProcessSAPRuntime.swift AppVault/Attestation/Wasm3Polyfill.swift \
            -import-objc-header AppVault/Wasm3/AVWasm3Bridge.h build/host-wasm3/*.o -o build/test-signer
          python3 Tests/RuntimeUI/test_interpreted_runtime.py build/test-signer "$APPVAULT_RUNTIME"
      - name: Verify live Store device provisioning and signed authentication
        env:
          APPVAULT_RUNTIME: /tmp/appvault-runtime-source/iPadn-iOS/vendor/SAPRuntime/files
        run: node scripts/store-runtime-probe.cjs
      - name: Test stock helper preparation and integrity
        run: |
          mkdir -p /tmp/appvault-helper-tests/Sources/HelperPreparation
          cp -R Tests/HelperPreparation/. /tmp/appvault-helper-tests/
          cp AppVault/Decryption/HelperManifest.swift AppVault/Decryption/HelperPreparation.swift /tmp/appvault-helper-tests/Sources/HelperPreparation/
          swift test --package-path /tmp/appvault-helper-tests
      - name: Generate helper and app projects
        run: |
          mkdir -p Generated
          python3 -c 'import zipfile; zipfile.ZipFile("Generated/DecryptHelper.zip", "w").close()'
          xcodegen generate
      - name: Build stock decryption helper template
        run: |
          xcodebuild -project AppVault.xcodeproj -scheme AppVaultDecrypt -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p helper-template/Payload
          cp -R build/Build/Products/Release-iphoneos/AppVaultDecrypt.app helper-template/Payload/
          ldid -SDecryptHelper/Helper.entitlements helper-template/Payload/AppVaultDecrypt.app/AppVaultDecrypt
          cp DecryptHelper/Helper.entitlements helper-template/Payload/AppVaultDecrypt.app/archived-expanded-entitlements.xcent
          rm Generated/DecryptHelper.zip
          (cd helper-template && zip -qry ../Generated/DecryptHelper.zip Payload)
      - name: Build device app
        run: xcodebuild -project AppVault.xcodeproj -scheme AppVault -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA with entitlement template
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AppVault.app Payload/
          ldid -SAppVault/AppVault.entitlements Payload/AppVault.app/AppVault
          cp AppVault/AppVault.entitlements Payload/AppVault.app/archived-expanded-entitlements.xcent
          zip -qry AppVault-0.7.2-25.ipa Payload
      - name: Build rootless signer helper (JavaScriptCore outside the UI process)
        run: |
          # Compile wasm3 C sources into object files
          WASM3_DIR=AppVault/Wasm3
          WASM3_OBJS=""
          for f in "$WASM3_DIR"/*.c; do
            obj="build/wasm3-$(basename "$f" .c).o"
            xcrun -sdk iphoneos clang -target arm64-apple-ios16.0 -O2 -std=gnu11 \
              -Wno-shorten-64-to-32 -Wno-sign-conversion -Wno-unused-function -Wno-comma \
              -I"$WASM3_DIR" -c "$f" -o "$obj"
            WASM3_OBJS="$WASM3_OBJS $obj"
          done
          # Build Swift signer helper with wasm3 polyfill
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios16.0 -O -swift-version 5 -module-name AppVaultSigner \
            SignerHelper/main.swift SignerHelper/Support.swift \
            AppVault/Attestation/InProcessSAPRuntime.swift \
            AppVault/Attestation/Wasm3Polyfill.swift \
            -import-objc-header AppVault/Wasm3/AVWasm3Bridge.h \
            $WASM3_OBJS \
            -o build/appvault-signer
          otool -L build/appvault-signer | grep -q JavaScriptCore.framework
          if otool -L build/appvault-signer | grep -q UIKit.framework; then echo "appvault-signer must not link UIKit"; exit 1; fi
      - name: Package privileged rootless jailbreak app
        run: |
          mkdir -p rootless/var/jb/Applications rootless/DEBIAN
          cp -R build/Build/Products/Release-iphoneos/AppVault.app rootless/var/jb/Applications/
          cp build/appvault-signer rootless/var/jb/Applications/AppVault.app/appvault-signer
          chmod 755 rootless/var/jb/Applications/AppVault.app/appvault-signer
          ldid -Spackaging/AppVault-signer.entitlements rootless/var/jb/Applications/AppVault.app/appvault-signer
          cp packaging/rootless/DEBIAN/* rootless/DEBIAN/
          chmod 755 rootless/DEBIAN/postinst rootless/DEBIAN/postrm
          ldid -Spackaging/AppVault-jailbreak.entitlements rootless/var/jb/Applications/AppVault.app/AppVault
          cp packaging/AppVault-jailbreak.entitlements rootless/var/jb/Applications/AppVault.app/archived-expanded-entitlements.xcent
          dpkg-deb --root-owner-group -Zgzip --build rootless AppVault-0.7.2-25-rootless.deb
          dpkg-deb --info AppVault-0.7.2-25-rootless.deb
      - uses: actions/upload-artifact@v4
        with:
          name: AppVault-0.7.2-ipa
          path: |
            AppVault-0.7.2-25.ipa
            AppVault-0.7.2-25-rootless.deb
      - name: Publish experimental native client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.7.2 >/dev/null 2>&1; then
            gh release create v0.7.2 AppVault-0.7.2-25.ipa AppVault-0.7.2-25-rootless.deb --target "$GITHUB_SHA" --title "AppVault 0.7.2 (25) - IPA download handling" --prerelease --notes-file RELEASE_NOTES.md
          fi
      - name: Refresh FlareStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,base64,subprocess,os
          from datetime import datetime,timezone
          repo=os.environ['GITHUB_REPOSITORY']
          latest=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/contents/repo.json']))
          data=json.loads(base64.b64decode(latest['content']))
          app=next(a for a in data['apps'] if a.get('bundleIdentifier')=='com.soum91.appvault')
          description='Prepare a per-app stock iOS decryption helper from a licensed IPA, sign/install it with payload-preserving EmberSign, then export from the helper. Requires the owning Apple Account and Developer Mode. Includes separate rootless installed-app export. Real-device helper signing/decryption remains unverified.'
          url='https://github.com/'+repo+'/releases/download/v0.7.2/AppVault-0.7.2-25.ipa'
          date=datetime.now(timezone.utc).strftime('%Y-%m-%d')
          app['subtitle']='IPA downloads and stock decryption helpers'
          app.update(version='0.7.2',versionDate=date,downloadURL=url,size=os.path.getsize('AppVault-0.7.2-25.ipa'),localizedDescription=description)
          app['versions']=[{'version':'0.7.2','buildVersion':'25','date':date,'downloadURL':url,'size':app['size'],'minOSVersion':'16.0','localizedDescription':description}]
          data['description']=description
          payload={'message':'Update FlareStore source for native AppVault 0.7.2 [skip ci]','sha':latest['sha'],'content':base64.b64encode((json.dumps(data,indent=2)+'\n').encode()).decode()}
          open('feed-request.json','w').write(json.dumps(payload))
          subprocess.check_call(['gh','api','--method','PUT','repos/'+repo+'/contents/repo.json','--input','feed-request.json'])
          PY
