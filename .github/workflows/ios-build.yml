name: iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: appvault-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.2 toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Block packaging on installed-version contract failures
        run: python3 scripts/check_version_ui.py
      - name: Verify data-copy regression fixtures
        run: |
          swiftc AppVault/AppDataCopy.swift Tests/main.swift -o /tmp/appvault-copy-tests
          /tmp/appvault-copy-tests
      - name: Install build tools
        run: brew install xcodegen ldid
      - name: Verify direct Store protocol fixtures
        run: |
          swiftc -parse-as-library AppVault/StoreProtocol.swift Tests/StoreProtocol/main.swift -o /tmp/appvault-store-tests
          /tmp/appvault-store-tests
      - name: Verify native signer and signed-login implementation
        run: |
          git clone https://github.com/Lakr233/ApplePackage.git /tmp/appvault-applepackage
          git -C /tmp/appvault-applepackage checkout --detach 391bfe6ee6598d73e4f94b88b38b50bd6f6ec67b
          swift test --package-path /tmp/appvault-applepackage --filter 'SAPAuthenticationRequestTests|SAPHandshakeTests|SAPSyntheticTests|SAPValidationTests|AuthenticateTests'
      - name: Verify live signed authentication reaches Apple's business response
        env:
          APPLEPACKAGE_SAP_LIVE_PROBE: '1'
          APPLEPACKAGE_SAP_PROBE_CONTROLS: '1'
        run: |
          set -o pipefail
          swift test --package-path /tmp/appvault-applepackage --filter SAPLiveProbeTests 2>&1 | tee /tmp/appvault-sap-probe.log
          python3 - <<'PY'
          import json,pathlib
          text=pathlib.Path('/tmp/appvault-sap-probe.log').read_text()
          rows=[json.loads(line.split('SAP_PROBE_SUMMARY ',1)[1]) for line in text.splitlines() if 'SAP_PROBE_SUMMARY ' in line]
          by={row['variant']:row for row in rows}
          assert by['signed']['status']==200 and by['signed']['response_kind']=='plist', 'Signed request did not reach Apple business authentication'
          assert by['unsigned']['status']==403 and by['corrupted']['status']==403, 'Unsigned/corrupted controls did not establish signature acceptance'
          print('Verified: SAP-signed HTTP 200 business response; unsigned and corrupted controls HTTP 403. No real account was used.')
          PY
      - run: xcodegen generate
      - name: Build device app
        run: xcodebuild -project AppVault.xcodeproj -scheme AppVault -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA with entitlement template
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AppVault.app Payload/
          ldid -SAppVault/AppVault.entitlements Payload/AppVault.app/AppVault
          cp AppVault/AppVault.entitlements Payload/AppVault.app/archived-expanded-entitlements.xcent
          zip -qry AppVault-0.4.2.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AppVault-0.4.2-ipa
          path: AppVault-0.4.2.ipa
      - name: Publish experimental native client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.4.2 >/dev/null 2>&1; then
            gh release create v0.4.2 AppVault-0.4.2.ipa --target "$GITHUB_SHA" --title "AppVault 0.4.2 (9) - native direct client" --prerelease --notes-file RELEASE_NOTES.md
          fi
      - name: Refresh FlareStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,base64,subprocess,os
          from datetime import datetime,timezone
          repo=os.environ['GITHUB_REPOSITORY']
          latest=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/contents/repo.json']))
          data=json.loads(base64.b64decode(latest['content']))
          app=next(a for a in data['apps'] if a.get('bundleIdentifier')=='com.soum91.appvault')
          description='Native SAP-signed Apple Store login and IPA downloads, with retained 2FA sessions. No JIT or jailbreak required. Signature acceptance is checked against Apple in CI; real-account device login/download remains unverified. Apple DRM remains.'
          url='https://github.com/'+repo+'/releases/download/v0.4.2/AppVault-0.4.2.ipa'
          date=datetime.now(timezone.utc).strftime('%Y-%m-%d')
          app.update(version='0.4.2',versionDate=date,downloadURL=url,size=os.path.getsize('AppVault-0.4.2.ipa'),localizedDescription=description)
          app['versions']=[{'version':'0.4.2','buildVersion':'9','date':date,'downloadURL':url,'size':app['size'],'minOSVersion':'16.0','localizedDescription':description}]
          data['description']=description
          payload={'message':'Update FlareStore source for native AppVault 0.4.2 [skip ci]','sha':latest['sha'],'content':base64.b64encode((json.dumps(data,indent=2)+'\n').encode()).decode()}
          open('feed-request.json','w').write(json.dumps(payload))
          subprocess.check_call(['gh','api','--method','PUT','repos/'+repo+'/contents/repo.json','--input','feed-request.json'])
          PY
