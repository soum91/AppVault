name: AppVault
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  AppVault:
    type: application
    platform: iOS
    sources:
      - path: AppVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.appvault
        PRODUCT_NAME: AppVault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.1
        CURRENT_PROJECT_VERSION: 4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AppVault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

        SWIFT_OBJC_BRIDGING_HEADER: AppVault/WorseQueryBridge.h
        CODE_SIGN_ENTITLEMENTS: AppVault/AppVault.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

    dependencies:
      - package: ZIPFoundation
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
